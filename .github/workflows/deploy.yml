name: 🚀 DORO CI/CD Deploy to Mini Server

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      skip_tests:
        description: "테스트를 건너뛰고 배포한다 (긴급 복구용. 평소에는 끈다)"
        type: boolean
        default: false

# 워크플로 토큰은 저장소 읽기만 허용한다 (배포는 러너 위에서 로컬로 실행하므로 쓰기 권한이 필요 없다).
permissions:
  contents: read

# 배포가 겹치면 같은 컨테이너/이미지를 동시에 건드리므로 순서대로 하나씩 실행한다.
# 그룹 이름을 바꾼 이유: 이전 그룹(doro-deploy)의 실행 #45 가 취소도 완료도 되지 않은 채 대기 상태로 남아 뒤의 모든 실행을 막았다(2026-10-08).
concurrency:
  group: doro-deploy-v2
  cancel-in-progress: false

jobs:
  # 테스트가 통과해야 배포한다. 러너에는 Java 25/Node 가 없어서 Docker 컨테이너 안에서 실행한다 (scripts/ci-test.sh).
  # 운영 서비스와 같은 호스트이므로 CPU/메모리를 제한한다.
  test:
    name: Test (backend + web)
    # 기본은 mini 러너. 저장소 변수 TEST_RUNS_ON(예: ["self-hosted","notebook"])을 설정하면 테스트만 다른 러너(노트북)에서 실행한다.
    # 배포(deploy)는 항상 mini 에서 한다. 노트북이 꺼져 있어 테스트가 대기하면 변수를 지우거나 수동 실행의 skip_tests 를 쓴다.
    runs-on: ${{ fromJSON(vars.TEST_RUNS_ON || '["self-hosted","mini"]') }}
    if: ${{ !inputs.skip_tests }}
    timeout-minutes: 30

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: 🧪 Backend tests (auth, guard, sdk)
        run: scripts/ci-test.sh backend

      - name: 🐘 Guard/Auth tests on a real PostgreSQL
        run: scripts/ci-test.sh pg

      - name: 🧪 Web tests and type check
        run: scripts/ci-test.sh web

      # 실제 Chromium 으로 폰 4가지 크기(320·375·414 세로, 812x375 가로)에서 포털 화면을 열어 가로 넘침·글자 잘림·터치 영역·입력 글꼴(iOS 확대)을 측정한다.
      # Playwright 공식 이미지를 쓰며 첫 실행은 이미지를 받느라 오래 걸린다.
      - name: 📱 Mobile layout regression tests (portal)
        run: scripts/ci-test.sh mobile

      - name: 🧪 Service worker precache check tests
        run: scripts/test-check-sw-precache.sh

      - name: 🧪 Deploy notification and smoke test script tests
        run: scripts/test-notify-and-smoke.sh

      - name: 🧪 Auto reboot scripts tests
        run: |
          scripts/test-auto-reboot.sh
          python3 -m unittest discover -s scripts/auto-reboot -p 'test_*.py'

  deploy:
    name: Build & Deploy on Mini Server
    needs: test
    # test 가 성공했거나(또는 수동 실행에서 의도적으로 건너뛴 경우)에만 배포한다. 실패/취소면 배포하지 않는다.
    # always() 를 쓰면 취소 요청이 와도 이 작업이 계속 대기·실행되어 Cancel workflow 가 먹지 않는다. !cancelled() 는 같은 조건에서 취소를 존중한다.
    if: ${{ !cancelled() && (needs.test.result == 'success' || needs.test.result == 'skipped') }}
    # 운영 서버(mini)에서만 배포한다. 다른 셀프호스티드 러너(노트북 등)가 이 작업을 가져가지 않도록 mini 라벨을 명시한다.
    runs-on: [self-hosted, mini]
    # 배포 후 점검 결과(마지막 부분)를 notify 작업이 텔레그램 메시지에 쓴다.
    outputs:
      smoke: ${{ steps.smoke.outputs.summary }}

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: 🛡️ Verify CSP inline-script hash
        run: scripts/check-csp-hash.sh web/index.html

      - name: ⚙️ Setup Environment & Databases
        run: |
          # .env 는 저장소에 없고 서버에서 직접 관리한다. actions/checkout 이 작업 디렉터리를 청소하므로
          # 러너 밖의 영구 위치(DORO_ENV_FILE, 기본 $HOME/doro/.env)에서 복사해 사용한다.
          # 예제 값(기본 비밀번호)으로는 배포하지 않는다.
          ENV_SRC="${DORO_ENV_FILE:-$HOME/doro/.env}"
          if [ ! -f "$ENV_SRC" ]; then
            echo "::error::$ENV_SRC not found. Create it from .env.example with real secrets before deploying."
            exit 1
          fi
          cp "$ENV_SRC" .env
          chmod 600 .env
          # Ensure new DB configs exist in .env
          grep -q "AUTH_DB" .env || echo "AUTH_DB=doro_auth" >> .env
          grep -q "GUARD_DB" .env || echo "GUARD_DB=doro_guard" >> .env
          set -a; . ./.env; set +a

          # 이미지를 먼저 빌드한다. 빌드가 실패하면 실행 중인 컨테이너를 건드리기 전에 중단된다.
          docker compose build

          # Start PostgreSQL & Redis first and ensure separate DBs exist
          docker compose up -d postgres redis
          sleep 3
          docker compose exec -T postgres psql -U "${POSTGRES_USER:-doro_admin}" -d postgres -c "CREATE DATABASE ${AUTH_DB:-doro_auth};" 2>/dev/null || true
          docker compose exec -T postgres psql -U "${POSTGRES_USER:-doro_admin}" -d postgres -c "CREATE DATABASE ${GUARD_DB:-doro_guard};" 2>/dev/null || true

      # 서비스 워커는 설치할 때 미리 캐시 목록(sw.js)의 주소를 모두 받아 저장한다. 게이트웨이가 그중 하나라도 다른 곳으로 이동시키면
      # 엉뚱한 화면이 저장돼 설치된 기기에서 되돌리기 어렵다(허브 빈 화면 사고). 컨테이너를 바꾸기 전에 새 이미지의 목록으로 점검한다.
      - name: 🔎 Service worker precache routing check (before deploy)
        run: |
          WEB_IMAGE="$(docker compose config --images | grep -E 'web$' | head -1)"
          scripts/check-sw-precache.sh "image:$WEB_IMAGE" / pre

      - name: 🐳 Deploy with Docker Compose
        run: |
          docker compose up -d --build --remove-orphans

      # 게이트웨이(nginx)는 compose 밖에 있고, 업스트림(포털·IAM 등) 이름을 시작·reload 때만 해석해 IP 를 기억한다.
      # 위에서 컨테이너가 다시 만들어져 IP 가 바뀌면 게이트웨이가 옛 IP 로 접속해 502(Host is unreachable)가 난다.
      # 그래서 배포 직후 설정을 검증하고(nginx -t) 무중단으로 reload 해 이름을 다시 해석시킨 뒤, 게이트웨이 경유 응답까지 확인한다.
      - name: 🔁 Reload gateway (re-resolve upstream IPs)
        env:
          GATEWAY_CONTAINER: doro-gateway
        run: |
          if ! docker inspect "$GATEWAY_CONTAINER" >/dev/null 2>&1; then
            echo "::warning::$GATEWAY_CONTAINER 컨테이너가 없어 reload 를 건너뛴다"
            exit 0
          fi
          docker exec "$GATEWAY_CONTAINER" nginx -t
          docker exec "$GATEWAY_CONTAINER" nginx -s reload
          # reload 직후 새 worker 가 뜰 때까지 짧게 재시도하며 게이트웨이 경유 응답을 확인한다(포털 로그인 화면).
          for i in $(seq 1 15); do
            code="$(curl -sk -o /dev/null -w '%{http_code}' -m 5 https://127.0.0.1/login || true)"
            if [ "$code" = "200" ]; then echo "gateway /login: $code"; exit 0; fi
            sleep 2
          done
          echo "::error::reload 후 게이트웨이 경유 /login 이 200 이 아니다(마지막 응답: ${code:-없음})"
          exit 1

      - name: 🔎 Service worker precache check (after deploy)
        run: |
          WEB_IMAGE="$(docker compose config --images | grep -E 'web$' | head -1)"
          scripts/check-sw-precache.sh "image:$WEB_IMAGE" / post

      - name: 🔍 Verify Health Status
        run: |
          set -a; . ./.env; set +a
          docker compose ps

          check() {
            name="$1"; url="$2"
            for i in $(seq 1 30); do
              if curl -fsS "$url" | grep -q '"status":"UP"'; then
                echo "$name: UP"
                return 0
              fi
              sleep 5
            done
            echo "::error::$name health check failed ($url)"
            return 1
          }

          check "Auth API" "http://localhost:${AUTH_PORT:-8080}/actuator/health"
          check "Guard API" "http://localhost:${GUARD_PORT:-8081}/actuator/health"

      # 컨테이너와 게이트웨이 경유 화면이 살아 있는지, 로그인이 필요한 API 가 비로그인 요청을 500 이 아니라 401/400 으로 거절하는지 확인한다.
      - name: 🔬 Post-deploy smoke test
        id: smoke
        run: |
          set +e
          scripts/post-deploy-smoke.sh | tee smoke.txt
          code="${PIPESTATUS[0]}"
          { echo 'summary<<SMOKE_EOF'; tail -c 1500 smoke.txt; echo 'SMOKE_EOF'; } >> "$GITHUB_OUTPUT"
          exit "$code"

      - name: 🧹 Clean unused images
        if: always()
        run: |
          docker image prune -f

  # 결과를 텔레그램으로 알린다(성공·테스트 실패·배포 실패 모두). 설정(TELEGRAM_BOT_TOKEN/CHAT_ID)은 서버의 ~/doro/.env 에 있고,
  # 없으면 알림만 건너뛴다. 알림 실패가 배포 결과를 바꾸지 않는다. 커밋 메시지는 env 로만 받아 셸에 끼워 넣지 않는다.
  notify:
    name: Telegram notification
    needs: [test, deploy]
    if: ${{ !cancelled() }}
    runs-on: [self-hosted, mini]
    timeout-minutes: 5
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: 📨 Send deploy result
        env:
          TEST_RESULT: ${{ needs.test.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          SMOKE: ${{ needs.deploy.outputs.smoke }}
          SHA: ${{ github.sha }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          ACTOR: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: scripts/format-deploy-message.sh | scripts/notify-telegram.sh
