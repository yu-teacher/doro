name: 🚀 DORO CI/CD Deploy to Mini Server

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy on Mini Server
    runs-on: self-hosted

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Environment & Databases
        run: |
          if [ ! -f .env ]; then
            cp .env.example .env
          else
            # Ensure new DB configs exist in .env
            grep -q "AUTH_DB" .env || echo "AUTH_DB=doro_auth" >> .env
            grep -q "GUARD_DB" .env || echo "GUARD_DB=doro_guard" >> .env
          fi

          # Start PostgreSQL & Redis first and ensure separate DBs exist
          docker compose up -d postgres redis
          sleep 3
          docker compose exec -T postgres psql -U doro_admin -d doro_iam -c "SELECT 'CREATE DATABASE doro_auth' WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'doro_auth')\gexec" || true
          docker compose exec -T postgres psql -U doro_admin -d doro_iam -c "SELECT 'CREATE DATABASE doro_guard' WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'doro_guard')\gexec" || true

      - name: 🐳 Deploy with Docker Compose
        run: |
          docker compose up -d --build --remove-orphans

      - name: 🔍 Verify Health Status
        run: |
          echo "Waiting 20 seconds for services to warm up..."
          sleep 20
          docker compose ps
          
          # Health check verification
          AUTH_STATUS=$(curl -s http://localhost:8080/actuator/health || echo "FAIL")
          GUARD_STATUS=$(curl -s http://localhost:8081/actuator/health || echo "FAIL")
          
          echo "Auth API Status: $AUTH_STATUS"
          echo "Guard API Status: $GUARD_STATUS"

      - name: 🧹 Clean unused images
        if: always()
        run: |
          docker image prune -f
