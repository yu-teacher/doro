server {
    listen 80;
    server_name localhost;
    client_max_body_size 10M;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # IAM API 프록시
    location /api/ {
        proxy_pass http://auth-api:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # OAuth 2.1 프록시
    location /oauth2/ {
        proxy_pass http://auth-api:8080/oauth2/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # OIDC Discovery & JWKS 프록시
    location /.well-known/ {
        proxy_pass http://auth-api:8080/.well-known/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 관리자 인가 확인 (auth_request 전용 내부 location)
    location = /_auth_admin {
        internal;
        proxy_pass http://auth-api:8080/api/v1/admin/authz;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Loki 로그 쿼리 프록시 (관리자 전용)
    location /loki/ {
        auth_request /_auth_admin;
        # 조회(GET/HEAD)만 허용. push 등 쓰기는 promtail 이 도커 네트워크로 직접 수행한다.
        limit_except GET HEAD {
            deny all;
        }
        proxy_pass http://loki:3100/loki/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
