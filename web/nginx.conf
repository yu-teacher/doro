server {
    listen 80;
    server_name localhost;
    client_max_body_size 10M;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # 서비스 워커·매니페스트·진입 HTML 은 항상 재검증해서 새 배포가 바로 반영되게 한다(옛 서비스 워커가 남지 않게).
    location ~ ^/(sw\.js|registerSW\.js|workbox-[A-Za-z0-9_-]+\.js|manifest\.webmanifest)$ {
        root /usr/share/nginx/html;
        # .webmanifest 는 기본 MIME 표에 없어 octet-stream 이 되므로 알려진 값으로 지정한다(.js 는 표에 있어 영향 없음).
        default_type application/manifest+json;
        add_header Cache-Control "no-cache" always;
    }

    # IAM API 프록시
    location /api/ {
        proxy_pass http://auth-api:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # OAuth 동의 화면은 SPA 라우트이므로 IAM 으로 프록시하지 않고 index.html 을 돌려준다.
    # 정확 일치(=)가 아래 /oauth2/ 접두사 프록시보다 우선한다.
    location = /oauth2/consent {
        root /usr/share/nginx/html;
        try_files /index.html =404;
    }

    # OAuth 2.1 프록시
    location /oauth2/ {
        proxy_pass http://auth-api:8080/oauth2/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # OIDC Discovery & JWKS 프록시
    location /.well-known/ {
        proxy_pass http://auth-api:8080/.well-known/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # (제거) Loki 로그 조회 프록시(/loki/)와 그 인가 확인(/_auth_admin): 운영에서는 게이트웨이가 /loki/ 를 중앙 Loki 로 넘기고, 포털 컨테이너는 거치지 않는다.
    # 이 파일에 loki 컨테이너 이름이 남아 있으면 그 컨테이너가 없을 때 nginx 가 시작하지 못한다("host not found in upstream").

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
