# 컨테이너 로그가 디스크를 채우지 않게 서비스별로 크기를 제한한다(json-file 기본은 무제한). 애플리케이션 서비스에만 적용한다:
# DB·Redis 는 설정이 바뀌면 다시 만들어져 재시작되므로 건드리지 않는다(필요하면 서버의 /etc/docker/daemon.json 의 log-opts 로 한다).
x-logging: &app-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    image: postgres:16-alpine
    container_name: doro-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-doro_iam}
      POSTGRES_USER: ${POSTGRES_USER:-doro_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_MULTIPLE_DATABASES: ${POSTGRES_MULTIPLE_DATABASES:-doro_auth,doro_guard}
    ports:
      - "${POSTGRES_BIND:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - doro_pgdata:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-doro_admin} -d ${POSTGRES_DB:-doro_iam}"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - doro-network

  redis:
    image: redis:7-alpine
    container_name: doro-redis
    restart: unless-stopped
    # command 가 redis-server 로 시작해야 공식 entrypoint 가 데이터 볼륨 소유권을 맞추고 redis 사용자로 권한을 낮춘다.
    # (sh -c 로 감싸면 root 로 남는다.) REDIS_PASSWORD 가 비어 있으면 requirepass 는 비활성이다.
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    ports:
      - "${REDIS_BIND:-127.0.0.1}:${REDIS_PORT:-6379}:6379"
    volumes:
      - doro_redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - doro-network

  auth-api:
    build:
      context: ./auth
      dockerfile: Dockerfile
    container_name: doro-auth-api
    restart: unless-stopped
    logging: *app-logging
    ports:
      - "${AUTH_BIND:-127.0.0.1}:${AUTH_PORT:-8080}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${AUTH_DB:-doro_auth}
      SPRING_DATASOURCE_USERNAME: ${AUTH_DB_USER:-${POSTGRES_USER:-doro_admin}}
      SPRING_DATASOURCE_PASSWORD: ${AUTH_DB_PASSWORD:-${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      DORO_IAM_ISSUER: ${DORO_IAM_ISSUER:-https://auth.doro.local}
      DORO_GUARD_URL: ${DORO_GUARD_URL:-http://guard-api:8081}
      DORO_GUARD_SERVICE_TOKEN: ${DORO_GUARD_AUTH_TOKEN:-${DORO_GUARD_SERVICE_TOKEN:-}}
      DORO_IAM_ACCESS_TOKEN_TTL_SECONDS: ${DORO_IAM_ACCESS_TOKEN_TTL_SECONDS:-900}
      DORO_IAM_INTERNAL_AUTH_MODE: ${DORO_IAM_INTERNAL_AUTH_MODE:-ENFORCE}
      DORO_IAM_INTERNAL_TOKENS: ${DORO_IAM_INTERNAL_TOKENS:-}
      # Redis 에 보관하는 JWT 개인키의 at-rest 암호화 시크릿(비어 있으면 평문 보관 + 기동 시 ERROR 로그). 키 로테이션 중에는 이전 공개키를 함께 게시한다.
      DORO_IAM_JWT_KEY_ENCRYPTION_SECRET: ${DORO_IAM_JWT_KEY_ENCRYPTION_SECRET:-}
      DORO_IAM_JWT_PREVIOUS_KEY_ID: ${DORO_IAM_JWT_PREVIOUS_KEY_ID:-}
      DORO_IAM_JWT_PREVIOUS_PUBLIC_KEY_PEM: ${DORO_IAM_JWT_PREVIOUS_PUBLIC_KEY_PEM:-}
      # 2FA(TOTP) 시크릿을 DB 에 AES-256-GCM 으로 암호화해 저장하는 키(openssl rand -base64 32). 비어 있으면 평문 저장 + 기동 시 경고.
      # 한 번 암호화한 뒤에는 키를 지우면 2FA 가 모두 막히니 비밀번호 관리자에 따로 보관한다. 교체할 때는 이전 키를 PREVIOUS_KEYS 에 둔다.
      DORO_IAM_TOTP_ENCRYPTION_KEY: ${DORO_IAM_TOTP_ENCRYPTION_KEY:-}
      DORO_IAM_TOTP_PREVIOUS_KEYS: ${DORO_IAM_TOTP_PREVIOUS_KEYS:-}
      DORO_IAM_SESSION_MAX_ACTIVE_PER_USER: ${DORO_IAM_SESSION_MAX_ACTIVE_PER_USER:-20}
      DORO_IAM_SESSION_MAX_OAUTH_PER_CLIENT: ${DORO_IAM_SESSION_MAX_OAUTH_PER_CLIENT:-3}
      # 세션 절대 수명(초). 로그인 후 이 시간이 지나면 계속 써도 갱신되지 않고 다시 로그인해야 한다. 기본 90일, 0 이하면 끈다.
      DORO_IAM_SESSION_ABSOLUTE_LIFETIME_SECONDS: ${DORO_IAM_SESSION_ABSOLUTE_LIFETIME_SECONDS:-7776000}
      # 만료·폐기된 리프레시 토큰과 비활성 세션 정리. 보존 기간(일)은 리프레시 토큰 유효기간(30일)보다 길게 둔다.
      DORO_IAM_TOKEN_PURGE_ENABLED: ${DORO_IAM_TOKEN_PURGE_ENABLED:-true}
      DORO_IAM_TOKEN_PURGE_RETENTION_DAYS: ${DORO_IAM_TOKEN_PURGE_RETENTION_DAYS:-90}
      # 첫 관리자 부트스트랩 토큰(기본 비어 있음 = 꺼짐). 쓴 뒤에는 지운다. scripts/bootstrap-first-admin.sh
      DORO_IAM_BOOTSTRAP_TOKEN: ${DORO_IAM_BOOTSTRAP_TOKEN:-}
      # 소셜 로그인(GitHub, Google). 비어 있으면 그 공급자는 꺼진다. 콜백 주소: <DORO_SOCIAL_PUBLIC_BASE_URL>/api/v1/auth/social/<공급자>/callback
      DORO_SOCIAL_PUBLIC_BASE_URL: ${DORO_SOCIAL_PUBLIC_BASE_URL:-}
      DORO_SOCIAL_GITHUB_CLIENT_ID: ${DORO_SOCIAL_GITHUB_CLIENT_ID:-}
      DORO_SOCIAL_GITHUB_CLIENT_SECRET: ${DORO_SOCIAL_GITHUB_CLIENT_SECRET:-}
      DORO_SOCIAL_GOOGLE_CLIENT_ID: ${DORO_SOCIAL_GOOGLE_CLIENT_ID:-}
      DORO_SOCIAL_GOOGLE_CLIENT_SECRET: ${DORO_SOCIAL_GOOGLE_CLIENT_SECRET:-}
      DORO_LOG_LEVEL: ${DORO_LOG_LEVEL:-INFO}
      DORO_OAUTH_ALLOWED_REDIRECT_URIS: ${DORO_OAUTH_ALLOWED_REDIRECT_URIS:-}
      # OAuth/OIDC: 클라이언트 등록 모드(OFF|WARN|ENFORCE), 브라우저 흐름의 동의 페이지, 인가 코드 저장소(auto|redis|memory)와 수명, 토큰 엔드포인트 요청 제한
      DORO_OAUTH_CLIENT_REGISTRY_MODE: ${DORO_OAUTH_CLIENT_REGISTRY_MODE:-ENFORCE}
      DORO_OAUTH_CONSENT_URL: ${DORO_OAUTH_CONSENT_URL:-/oauth2/consent}
      DORO_OAUTH_CODE_STORE: ${DORO_OAUTH_CODE_STORE:-auto}
      DORO_OAUTH_CODE_TTL_SECONDS: ${DORO_OAUTH_CODE_TTL_SECONDS:-300}
      DORO_IAM_RATE_LIMIT_TOKEN_MAX: ${DORO_IAM_RATE_LIMIT_TOKEN_MAX:-60}
      DORO_CORS_ALLOWED_ORIGIN_PATTERNS: ${DORO_CORS_ALLOWED_ORIGIN_PATTERNS:-https://varen05.asuscomm.com,http://192.168.0.101:*,http://localhost:*,http://127.0.0.1:*}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      guard-api:
        condition: service_started
    networks:
      - doro-network

  guard-api:
    build:
      context: ./guard
      dockerfile: Dockerfile
    container_name: doro-guard-api
    restart: unless-stopped
    logging: *app-logging
    ports:
      - "${GUARD_BIND:-127.0.0.1}:${GUARD_PORT:-8081}:8081"
      - "${GUARD_BIND:-127.0.0.1}:${GUARD_GRPC_PORT:-9090}:9090"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${GUARD_DB:-doro_guard}
      SPRING_DATASOURCE_USERNAME: ${GUARD_DB_USER:-${POSTGRES_USER:-doro_admin}}
      SPRING_DATASOURCE_PASSWORD: ${GUARD_DB_PASSWORD:-${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}}
      PORT: 8081
      GRPC_PORT: 9090
      DORO_GUARD_SECURITY_MODE: ${DORO_GUARD_SECURITY_MODE:-OFF}
      DORO_GUARD_SERVICE_TOKEN: ${DORO_GUARD_SERVICE_TOKEN:-}
      DORO_GUARD_SERVICE_TOKENS: ${DORO_GUARD_SERVICE_TOKENS:-}
      # 튜플/스키마 검증 모드(OFF|WARN|ENFORCE), 다중 인스턴스 스키마 갱신 주기(초, 0=끔), 캐시 설정
      DORO_GUARD_VALIDATION_MODE: ${DORO_GUARD_VALIDATION_MODE:-WARN}
      DORO_GUARD_SCHEMA_REFRESH_SECONDS: ${DORO_GUARD_SCHEMA_REFRESH_SECONDS:-30}
      DORO_GUARD_CACHE_TTL_SECONDS: ${DORO_GUARD_CACHE_TTL_SECONDS:-60}
      DORO_GUARD_CACHE_MAX_SIZE: ${DORO_GUARD_CACHE_MAX_SIZE:-50000}
      DORO_LOG_LEVEL: ${DORO_LOG_LEVEL:-INFO}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - doro-network

  # 브라우저 로그인(OAuth)·세션·토큰 갱신을 서비스(blog/party/games) 밖에서 맡는다. 게이트웨이(nginx)가 요청마다 이 서비스에 쿠키를
  # 토큰으로 바꿔 달라고 묻고(auth_request), 받은 토큰을 서비스에 Bearer 로 붙여 준다. 서비스를 BFF 모드(gateway)로 바꾸기 전까지는
  # 이 컨테이너가 떠 있어도 기존 서비스 동작에 영향이 없다. 설정은 scripts/enable-bff.sh 와 docs/BFF.md 참고.
  bff-api:
    build:
      context: .
      dockerfile: bff/Dockerfile
    container_name: doro-bff-api
    restart: unless-stopped
    logging: *app-logging
    ports:
      - "127.0.0.1:${BFF_PORT:-8085}:8085"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${BFF_DB:-doro_bff}
      SPRING_DATASOURCE_USERNAME: ${BFF_DB_USER:-${POSTGRES_USER:-doro_admin}}
      SPRING_DATASOURCE_PASSWORD: ${BFF_DB_PASSWORD:-${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}}
      IAM_HOST: auth-api
      IAM_PORT: 8080
      DORO_IAM_ISSUER: ${DORO_IAM_ISSUER:-https://auth.doro.local}
      # 탈퇴 동기화(IAM 내부 API)용 서비스 토큰. IAM 의 DORO_IAM_INTERNAL_TOKENS 에 'bff:<토큰>' 으로 등록한 값이다. 없으면 동기화는 실패 로그만 남긴다.
      DORO_IAM_INTERNAL_TOKEN: ${BFF_IAM_INTERNAL_TOKEN:-}
      # 토큰·PKCE verifier 를 DB 에 암호화해 두는 키(openssl rand -base64 32). 바꾸면 모든 BFF 세션이 무효가 된다(다시 로그인).
      BFF_SESSION_KEY: ${BFF_SESSION_KEY:?BFF_SESSION_KEY must be set in .env (scripts/enable-bff.sh)}
      BFF_COOKIE_SECURE: "true"
      # 브라우저가 보는 공개 주소(기본: IAM issuer 와 같다). 서비스별 redirect_uri 는 IAM 의 OAuth 클라이언트에 등록한 값과 같아야 한다.
      BFF_OAUTH_AUTHORIZE_URL: ${BFF_PUBLIC_ORIGIN:-${DORO_IAM_ISSUER:-https://auth.doro.local}}/oauth2/authorize
      # 개발자 제품(Doro Dev) 아래로 옮겼다: 옛 /blog/·/interview/ 는 게이트웨이가 새 주소로 이동시킨다. 새 복귀 주소는 IAM 에 미리 등록돼 있어야 한다.
      BLOG_WEB_BASE_PATH: /dev/blog
      BLOG_OAUTH_REDIRECT_URI: ${BFF_PUBLIC_ORIGIN:-${DORO_IAM_ISSUER:-https://auth.doro.local}}/dev/blog/api/v1/bff/callback
      PARTY_OAUTH_REDIRECT_URI: ${BFF_PUBLIC_ORIGIN:-${DORO_IAM_ISSUER:-https://auth.doro.local}}/party/api/v1/bff/callback
      GAMES_OAUTH_REDIRECT_URI: ${BFF_PUBLIC_ORIGIN:-${DORO_IAM_ISSUER:-https://auth.doro.local}}/games/api/v1/bff/callback
      INTERVIEW_WEB_BASE_PATH: /dev/interview
      INTERVIEW_OAUTH_REDIRECT_URI: ${BFF_PUBLIC_ORIGIN:-${DORO_IAM_ISSUER:-https://auth.doro.local}}/dev/interview/api/v1/bff/callback
    depends_on:
      postgres:
        condition: service_healthy
      auth-api:
        condition: service_started
    networks:
      - doro-network

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: doro-web-portal
    restart: unless-stopped
    logging: *app-logging
    ports:
      - "${WEB_BIND:-0.0.0.0}:${WEB_PORT:-3000}:80"
    depends_on:
      - auth-api
      - guard-api
    networks:
      - doro-network

networks:
  doro-network:
    driver: bridge

volumes:
  doro_pgdata:
  doro_redisdata:


