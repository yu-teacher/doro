# 노트북 전용 덧붙임: 중앙 Loki 와 같은 Docker 네트워크에 붙어 loki:3100 으로 직접 보낸다(LAN 의 nginx 게이트웨이를 거치지 않는다).
# 노트북에서는 이렇게 실행한다: docker compose -f docker-compose.yml -f docker-compose.notebook.yml --env-file .env up -d
services:
  alloy:
    networks: [default, central]
networks:
  central:
    name: central-logs_logs
    external: true
