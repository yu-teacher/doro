# 서버의 로그를 중앙 로그 저장소(Loki, 노트북)로 보내는 수집기(Grafana Alloy). 서버마다 하나씩 띄운다.
#   cd ~/log-shipper && docker compose --env-file .env up -d
# 읽는 것: SSH/sudo 기록(/var/log/auth.log, log_type=audit), systemd journal, (미니만) Docker 컨테이너 로그.
# 호스트의 /var/log 와 docker.sock 은 읽기 전용으로 붙인다. 어떤 설정 파일을 쓸지는 ./conf.d 에 둔 파일로 정한다
#   host.alloy   모든 서버(auth.log + journal)
#   docker.alloy 컨테이너가 있는 서버만(미니)
name: log-shipper

services:
  alloy:
    image: grafana/alloy:${ALLOY_VERSION:-v1.20.1}
    restart: unless-stopped
    # auth.log(640 syslog:adm)와 journal 을 읽으려면 root 가 필요하다. 쓰기 가능한 마운트는 자체 데이터 볼륨뿐이다.
    user: "0:0"
    command:
      - run
      - --server.http.listen-addr=127.0.0.1:12345
      - --storage.path=/var/lib/alloy/data
      - --disable-reporting
      - /etc/alloy/
    environment:
      LOKI_URL: "${LOKI_URL:?.env 에 LOKI_URL 을 설정한다 (예 http://192.168.0.4:3100)}"
      HOST_NAME: "${HOST_NAME:?.env 에 HOST_NAME 을 설정한다 (예 mini)}"
    volumes:
      - ./conf.d:/etc/alloy:ro
      - /var/log:/host/var/log:ro
      - alloy-data:/var/lib/alloy/data
      - ${DOCKER_SOCK:-/var/run/docker.sock}:/var/run/docker.sock:ro

volumes:
  alloy-data:
