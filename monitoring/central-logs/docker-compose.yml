# 중앙 로그 저장소(Loki) + 화면(Grafana). 노트북에서 실행한다. 로그는 미니/파이/노트북이 이곳으로 보낸다(push).
#   cd ~/central-logs && docker compose --env-file .env up -d
# - Loki 는 직접 노출하지 않는다. 앞단 nginx(loki-gateway)가 허용한 서버 IP 에서 오는 push 만 통과시킨다
#   (Docker 가 publish 한 포트는 ufw 를 우회하므로, 접근 제한을 방화벽이 아니라 nginx 에서 한다).
# - Grafana 는 노트북 안(127.0.0.1)에서만 열린다. 볼 때는 ssh -L 3300:127.0.0.1:3300 notebook 으로 터널을 만든다.
# - 읽기 전용 질의용으로 Loki 를 127.0.0.1:3101 에도 연다(노트북 안에서만 접근 가능).
name: central-logs

services:
  loki:
    image: grafana/loki:${LOKI_VERSION:-3.3.2}
    command: ["-config.file=/etc/loki/loki-config.yaml"]
    restart: unless-stopped
    volumes:
      - ./loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki-data:/loki
    ports:
      - "127.0.0.1:${LOKI_LOCAL_PORT:-3101}:3100"
    networks: [logs]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3100/ready | grep -q ready"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  loki-gateway:
    image: nginx:${NGINX_VERSION:-1.27-alpine}
    restart: unless-stopped
    depends_on:
      loki:
        condition: service_healthy
    environment:
      LOKI_ALLOW_1: ${LOKI_ALLOW_1:?허용할 서버 IP(미니)를 .env 에 설정한다}
      LOKI_ALLOW_2: ${LOKI_ALLOW_2:?허용할 서버 IP(파이)를 .env 에 설정한다}
    volumes:
      - ./nginx-loki.conf.template:/etc/nginx/templates/default.conf.template:ro
    ports:
      - "${LOKI_PUSH_PORT:-3100}:8080"
    networks: [logs]

  grafana:
    image: grafana/grafana:${GRAFANA_VERSION:-11.4.0}
    restart: unless-stopped
    depends_on:
      loki:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?.env 에 GRAFANA_ADMIN_PASSWORD 를 설정한다}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      # 알림 메시지의 링크가 접속 방식(ssh -L 3300:127.0.0.1:3300)과 맞도록 한다.
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3300}
      # 알림 설정(alerting-active/*.yaml)의 $__env{...} 로 쓰인다. 비어 있으면 알림 설정을 켜지 않는다(enable-alerting.sh 참고).
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      SSH_ALLOWED_SRC_REGEX: ${SSH_ALLOWED_SRC_REGEX:-}
    volumes:
      - ./grafana-datasources.yaml:/etc/grafana/provisioning/datasources/loki.yaml:ro
      - ./alerting-active:/etc/grafana/provisioning/alerting:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3300}:3000"
    networks: [logs]

volumes:
  loki-data:
  grafana-data:

networks:
  logs:
