server:
  port: ${PORT:8081}

spring:
  application:
    name: doro-guard
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  config:
    import: optional:classpath:application-secret.yaml

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/doro_iam}
    username: ${SPRING_DATASOURCE_USERNAME:doro_admin}
    password: ${SPRING_DATASOURCE_PASSWORD:doro_secret}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 15
      minimum-idle: 2
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
    open-in-view: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    table: guard_schema_history
    locations: classpath:db/migration,classpath:db/vendor/{vendor}

doro:
  guard:
    grpc:
      port: ${GRPC_PORT:9090}
    engine:
      # Check/Expand 재귀 탐색 최대 깊이
      max-depth: 32
      # L1(Caffeine) 인가 결과 캐시 TTL(초)과 최대 항목 수. TTL 0 이면 캐시하지 않는다.
      cache-ttl-seconds: ${DORO_GUARD_CACHE_TTL_SECONDS:60}
      cache-max-size: ${DORO_GUARD_CACHE_MAX_SIZE:50000}
      # Expand 응답 트리의 최대 노드 수. 넘으면 전개를 멈추고 루트에 "truncated":true 를 표시한다.
      expand-max-nodes: ${DORO_GUARD_EXPAND_MAX_NODES:5000}
    validation:
      # OFF | WARN | ENFORCE. 튜플(타입/릴레이션 선언 여부)과 스키마 DSL(이해 못 한 줄, 선언되지 않은 타입 참조) 검증.
      # WARN 은 로그만 남기고, ENFORCE 는 400(INVALID_TUPLE / INVALID_SYNTAX)으로 거부한다.
      mode: ${DORO_GUARD_VALIDATION_MODE:WARN}
    schema:
      # DB 의 활성 스키마 버전을 주기적으로 확인해 다른 인스턴스의 변경/기동 시 폴백을 반영한다(초). 0 이면 비활성.
      refresh-interval-seconds: ${DORO_GUARD_SCHEMA_REFRESH_SECONDS:30}
    security:
      # OFF | WARN | ENFORCE. 모든 호출자가 토큰을 보내도록 배포한 뒤 OFF -> WARN -> ENFORCE 순으로 올린다.
      mode: ${DORO_GUARD_SECURITY_MODE:OFF}
      service-token: ${DORO_GUARD_SERVICE_TOKEN:}
      # 호출자별 토큰. 형식: auth:<토큰>,blog:<토큰> (토큰은 32자 이상). 공유 토큰과 함께 쓸 수 있다.
      service-tokens: ${DORO_GUARD_SERVICE_TOKENS:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} [traceId=%X{traceId:-NONE}] [clientIp=%X{clientIp:-LOCAL}] - %msg%n"
  level:
    com.hunnit_beasts.guard: ${DORO_LOG_LEVEL:INFO}

