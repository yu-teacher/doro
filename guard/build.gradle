plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.0'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'com.google.protobuf' version '0.9.4'
}

group = 'com.hunnit-beasts'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

repositories {
	mavenCentral()
}

def grpcVersion = '1.68.1'
def protobufVersion = '3.25.5'

dependencies {
	// Web, Validation, Actuator & OpenAPI
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'io.micrometer:micrometer-registry-prometheus'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.5'

	// JPA, Flyway & Postgres
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.flywaydb:flyway-core'
	implementation 'org.flywaydb:flyway-database-postgresql'
	runtimeOnly 'org.postgresql:postgresql'
	testRuntimeOnly 'com.h2database:h2'

	// Caching: L1 Caffeine (Guard 는 Redis 를 사용하지 않는다. 스타터가 있으면 /actuator/health 에 Redis 지표가 섞인다)
	implementation 'com.github.ben-manes.caffeine:caffeine:3.1.8'
	implementation 'com.fasterxml.jackson.core:jackson-databind'

	// gRPC & Protobuf
	implementation "io.grpc:grpc-netty-shaded:${grpcVersion}"
	implementation "io.grpc:grpc-protobuf:${grpcVersion}"
	implementation "io.grpc:grpc-stub:${grpcVersion}"
	implementation "com.google.protobuf:protobuf-java:${protobufVersion}"
	compileOnly 'jakarta.annotation:jakarta.annotation-api:3.0.0'

	// Lombok
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	testCompileOnly 'org.projectlombok:lombok'
	testAnnotationProcessor 'org.projectlombok:lombok'

	// Test
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation "io.grpc:grpc-testing:${grpcVersion}"
	testImplementation "io.grpc:grpc-inprocess:${grpcVersion}"
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

protobuf {
	protoc {
		artifact = "com.google.protobuf:protoc:${protobufVersion}"
	}
	plugins {
		grpc {
			artifact = "io.grpc:protoc-gen-grpc-java:${grpcVersion}"
		}
	}
	generateProtoTasks {
		all()*.plugins {
			grpc {}
		}
	}
}

tasks.named('test') {
	// 실제 PostgreSQL 이 필요한 테스트(@PostgresTest)는 testOnPostgres 에서만 실행한다
	useJUnitPlatform { excludeTags 'postgres' }
	maxHeapSize = '2048m'
}

// 같은 테스트 전체를 H2 가 아니라 실제 PostgreSQL 위에서 운영과 같은 방식(Flyway + ddl-auto=validate)으로 다시 실행한다.
// H2 + create-drop 은 마이그레이션 SQL 오류, 엔티티와 스키마의 불일치, FK/부분 유니크 인덱스 같은 PostgreSQL 규칙을 검증하지 못한다.
// 접속 정보: TEST_PG_URL(jdbc:postgresql://host:port/db), TEST_PG_USER, TEST_PG_PASSWORD. 스키마 suite_<모듈> 는 미리 만들어 둔다.
// scripts/ci-test.sh pg 가 일회용 PostgreSQL 을 띄우고 이 태스크를 실행한다.
tasks.register('testOnPostgres', Test) {
	description = 'Runs the whole test suite against a real PostgreSQL (Flyway + ddl-auto=validate)'
	group = 'verification'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	useJUnitPlatform()
	maxHeapSize = '2048m'
	shouldRunAfter tasks.named('test')
	// 접속 주소가 H2 로 고정된 테스트는 이 모드에서 의미가 없다 (같은 검증을 PostgreSQL 로 이미 수행한다)
	filter { excludeTestsMatching '*MigrationSchemaValidationTest' }
	doFirst {
		def pgUrl = System.getenv('TEST_PG_URL')
		if (!pgUrl) {
			throw new GradleException('TEST_PG_URL 이 필요하다. 예) jdbc:postgresql://localhost:5432/postgres (scripts/ci-test.sh pg 참고)')
		}
		def sep = pgUrl.contains('?') ? '&' : '?'
		environment 'SPRING_DATASOURCE_URL', pgUrl + sep + 'currentSchema=suite_' + project.name
		environment 'SPRING_DATASOURCE_USERNAME', System.getenv('TEST_PG_USER') ?: 'postgres'
		environment 'SPRING_DATASOURCE_PASSWORD', System.getenv('TEST_PG_PASSWORD') ?: ''
		environment 'SPRING_DATASOURCE_DRIVER_CLASS_NAME', 'org.postgresql.Driver'
		environment 'SPRING_JPA_HIBERNATE_DDL_AUTO', 'validate'
		environment 'SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT', 'org.hibernate.dialect.PostgreSQLDialect'
		environment 'SPRING_FLYWAY_ENABLED', 'true'
	}
}
