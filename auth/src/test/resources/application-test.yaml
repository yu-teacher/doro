spring:
  application:
    name: doro-iam-test

  datasource:
    url: jdbc:h2:mem:doro_iam_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
        jdbc:
          time_zone: UTC
    open-in-view: false

  flyway:
    enabled: false

doro:
  oauth:
    code-store: memory
    # 기존 테스트는 등록하지 않은 client_id + 환경변수 허용 URI 로 동작한다. 운영 기본값(ENFORCE)은 별도 테스트가 검증한다.
    client-registry-mode: WARN
    allowed-redirect-uris: http://localhost:3000/callback,https://app-a.com/cb,https://app.doro.local/callback
  cors:
    allowed-origin-patterns: http://localhost:*,http://127.0.0.1:*
  iam:
    issuer: https://auth.doro.local
    # 내부 API 호출자 인증(테스트 전용 토큰). 운영 기본값은 ENFORCE.
    internal-auth:
      mode: ENFORCE
      tokens: ci-blog:test-only-internal-token-0123456789abcdef0123456789abcdef
    jwt:
      access-token-validity-seconds: 86400
      refresh-token-validity-seconds: 2592000
      # 테스트에는 Redis 가 없어도 기동해야 한다(운영은 기본값 true 로 키를 읽지 못하면 기동을 중단한다)
      fail-on-key-store-error: false
    rate-limit:
      enabled: false
    session:
      max-active-sessions-per-user: 10
      inactivity-timeout-seconds: 2592000

management:
  health:
    redis:
      enabled: false
