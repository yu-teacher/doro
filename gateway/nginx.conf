events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    client_max_body_size 30M;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Upstreams
    upstream portal_upstream {
        server web:80;
    }

    upstream iam_upstream {
        server auth-api:8080;
    }

    upstream blog_web_upstream {
        server doro-blog-web:80;
    }

    upstream blog_api_upstream {
        server doro-blog-backend:8082;
    }

    upstream minio_upstream {
        server doro-minio:9000;
    }

    upstream loki_upstream {
        server loki:3100;
    }

    upstream menu_upstream {
        server doro-menu:80;
    }

    # Map referer to determine if assets belong to Portal or Blog
    map $http_referer $assets_upstream {
        default http://blog_web_upstream;
        ~*(logs|account|login|signup|oauth2|portal) http://portal_upstream;
    }

    # Route /api/v1/users/me based on portal referer or PATCH method to IAM upstream
    map "$http_referer:$request_method" $users_me_upstream {
        default http://blog_api_upstream;
        ~*(logs|account|login|signup|oauth2|portal): http://iam_upstream;
        ~:PATCH$ http://iam_upstream;
    }

    # 1. HTTP Server (Port 80) -> ACME Challenge & Redirect to HTTPS
    server {
        listen 80;
        server_name varen05.asuscomm.com localhost _;

        # Let's Encrypt ACME Challenge
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Redirect all other HTTP traffic to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # 2. HTTPS Server (Port 443) -> Full SSL Termination & Service Routing
    server {
        listen 443 ssl;
        http2 on;
        server_name varen05.asuscomm.com localhost _;

        # SSL Certificates
        ssl_certificate /etc/letsencrypt/live/varen05.asuscomm.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/varen05.asuscomm.com/privkey.pem;

        # TLS Protocols & Modern Ciphers
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # Security Headers
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # Strip trailing slash from API requests internally so Spring Boot 3 matches cleanly
        rewrite ^(/api/v1/.*?)/+$ $1;

        # 1. MinIO Object Storage (이미지/미디어 서빙)
        location /media/ {
            proxy_pass http://minio_upstream/doro-blog-media/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 2. DORO Central Observability / Loki Log Query API
        location /loki/ {
            # 조회(GET/HEAD)만 허용. push 등 쓰기는 promtail 이 도커 네트워크로 직접 수행한다.
            limit_except GET HEAD {
                deny all;
            }
            proxy_pass http://loki_upstream/loki/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 3. DORO IAM Auth, Session, Admin, Password, Users APIs
        location /api/v1/auth {
            proxy_pass http://iam_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/v1/sessions {
            proxy_pass http://iam_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/v1/admin/users {
            proxy_pass http://iam_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /api/v1/users/me/password {
            proxy_pass http://iam_upstream/api/v1/users/me/password;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /api/v1/users/me {
            proxy_pass $users_me_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 4. Blog Backend API (/api/v1/posts, /api/v1/users 등)
        location /api/v1/ {
            proxy_pass http://blog_api_upstream/api/v1/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 5. DORO IAM API & OIDC Discovery
        location /iam/ {
            proxy_pass http://iam_upstream/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /oauth2/ {
            proxy_pass http://iam_upstream/oauth2/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /.well-known/ {
            proxy_pass http://iam_upstream/.well-known/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 6. Portal Static Icons & Assets
        location = /shield.svg {
            proxy_pass http://portal_upstream/shield.svg;
            proxy_set_header Host $host;
        }

        location /assets/ {
            proxy_pass $assets_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 7. DORO Central Portal Routes (Logs, Login, Signup, Account, Consent)
        location ~ ^/(logs|login|signup|account|portal)(/.*)?$ {
            proxy_pass http://portal_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 8. DORO Menu Frontend (오늘 뭐 먹지? 도로메뉴 서브 서비스)
        location /menu/ {
            proxy_pass http://menu_upstream/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /menu {
            return 301 /menu/;
        }

        # 8-1. DORO Menu Static Assets (/doro/)
        location /doro/ {
            proxy_pass http://menu_upstream/doro/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 9. DORO Blog Web Frontend (기본 메인 웹 & 블로그 라우팅)
        location / {
            proxy_pass http://blog_web_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
