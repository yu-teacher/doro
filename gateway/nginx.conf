events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    # 응답 헤더와 오류 페이지에 nginx 버전을 노출하지 않는다.
    server_tokens off;
    client_max_body_size 30M;

    # CSP 위반 보고 수집: 요청 본문을 남기는 전용 로그 포맷과 남용 방지용 제한
    log_format csp_report '$remote_addr [$time_local] CSP-REPORT $request_body';
    limit_req_zone $binary_remote_addr zone=csp_reports:1m rate=30r/m;

    # 블로그 쓰기 API(POST/PUT/PATCH/DELETE) 남용 방지: 클라이언트 IP 당 초당 5회(순간 20회까지 허용).
    # 키가 빈 문자열이면 nginx 는 제한하지 않으므로 읽기 요청(GET 등)은 영향받지 않는다.
    map $request_method $blog_write_limit_key {
        default "";
        POST    $binary_remote_addr;
        PUT     $binary_remote_addr;
        PATCH   $binary_remote_addr;
        DELETE  $binary_remote_addr;
    }
    limit_req_zone $blog_write_limit_key zone=blog_writes:10m rate=5r/s;
    limit_req_status 429;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Upstreams
    upstream portal_upstream {
        server web:80;
    }

    upstream iam_upstream {
        server auth-api:8080;
    }

    upstream blog_web_upstream {
        server doro-blog-web:80;
    }

    upstream blog_api_upstream {
        server doro-blog-backend:8082;
    }

    upstream minio_upstream {
        server doro-minio:9000;
    }

    upstream loki_upstream {
        # 중앙 로그 저장소(노트북의 Loki). 포털 로그 조회 화면이 /loki/ 로 읽는다. 이름이 아니라 IP 인 이유: 이름이 사라지면 nginx 가 시작하지 못한다.
        server 192.168.0.4:3100;
    }

    upstream menu_upstream {
        server doro-menu:80;
    }

    upstream games_web_upstream {
        server doro-games-web:80;
    }

    upstream games_api_upstream {
        server doro-games-api:8087;
    }

    upstream party_web_upstream {
        server doro-party-web:80;
    }

    upstream party_api_upstream {
        server doro-party-api:8086;
    }

    # Map referer to determine if assets belong to Portal or Blog
    # 전환 후: /assets/ 는 포털 에셋만 준다. 블로그 에셋은 /blog/assets/ 로 오므로 Referer 로 추측할 필요가 없다.
    map $http_referer $assets_upstream {
        default http://portal_upstream;
    }

    # Route /api/v1/users/me based on portal referer or PATCH method to IAM upstream
    # 전환 후: 루트의 /api/v1/users/me 는 IAM(포털) 것이다. 블로그는 /blog/api/v1/users/me 를 쓴다.
    map "$http_referer:$request_method" $users_me_upstream {
        default http://iam_upstream;
    }

    # CSP 보고 수신용 내부 응답 서버 (컨테이너 loopback 전용, 외부에 노출되지 않는다)
    server {
        listen 127.0.0.1:8099;
        access_log off;
        location / { return 204; }
    }

    # 1. HTTP Server (Port 80) -> ACME Challenge & Redirect to HTTPS
    server {
        listen 80;
        server_name varen05.asuscomm.com localhost _;

        # Let's Encrypt ACME Challenge
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Redirect all other HTTP traffic to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # 2. HTTPS Server (Port 443) -> Full SSL Termination & Service Routing
    server {
        listen 443 ssl;
        http2 on;
        server_name varen05.asuscomm.com localhost _;

        # SSL Certificates
        ssl_certificate /etc/letsencrypt/live/varen05.asuscomm.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/varen05.asuscomm.com/privkey.pem;

        # TLS Protocols & Modern Ciphers
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # Security Headers
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        # 구형 XSS 필터는 오히려 취약점이 되므로 끈다 (OWASP 권장)
        add_header X-XSS-Protection "0" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), payment=(), usb=(), geolocation=(self)" always;
        # CSP(강제): 세 앱(blog/portal/menu)의 GA4 인라인 초기화 스크립트는 내용이 같아 해시 하나로 허용한다.
        # 위반은 report-uri 로 계속 수집된다. 문제가 생기면 이 헤더 이름을 Content-Security-Policy-Report-Only 로 되돌린다.
        # index.html 의 인라인 스크립트를 바꾸면 이 해시도 함께 바꿔야 한다 (scripts/check-csp-hash.sh 로 검증).
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-yLKaOYTDJXg2M9bDpcd4rzwzVxSP6xkMDZATsqdT0Tk=' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net; font-src 'self' data: https://fonts.gstatic.com https://cdn.jsdelivr.net; img-src 'self' data: blob: https:; media-src 'self' blob: https:; connect-src 'self' https://www.googletagmanager.com https://www.google-analytics.com https://*.google-analytics.com https://*.analytics.google.com https://nominatim.openstreetmap.org; frame-ancestors 'self'; base-uri 'self'; object-src 'none'; form-action 'self'; report-uri /csp-report" always;

        # Strip trailing slash from API requests internally so Spring Boot 3 matches cleanly
        rewrite ^(/api/v1/.*?)/+$ $1;
        rewrite ^(/blog/api/v1/.*?)/+$ $1;

        # 1. MinIO Object Storage (이미지/미디어 서빙)
        # 버킷 자체(목록 조회)는 공개하지 않는다. 객체는 키를 아는 경우에만 읽을 수 있다.
        location = /media/ {
            return 404;
        }

        location /media/ {
            # S3 목록/메타 조회 쿼리는 막는다 (버킷 정책에서도 익명 ListBucket 을 허용하지 않는다)
            if ($args ~* "(^|&)(list-type|prefix|delimiter|marker|max-keys|versions|uploads)(=|&|$)") {
                return 404;
            }

            proxy_pass http://minio_upstream/doro-blog-media/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;

            # MinIO 가 자체적으로 붙이는 보안 헤더는 아래에서 다시 붙이는 값과 중복되므로 업스트림 값은 숨긴다.
            proxy_hide_header X-Content-Type-Options;
            proxy_hide_header X-XSS-Protection;
            proxy_hide_header Strict-Transport-Security;
            proxy_hide_header Content-Security-Policy;

            # 업로드된 파일(특히 SVG)이 이미지가 아니라 문서로 직접 열려도 스크립트/외부 로딩이 실행되지 않게 한다.
            # SVG 는 업로드 시 서버에서 허용 목록 방식으로 정제하지만, 그와 별개로 이중 방어를 건다.
            # nginx 는 location 에 add_header 가 하나라도 있으면 server 수준 헤더를 상속하지 않으므로 공통 보안 헤더를 다시 적는다.
            add_header X-Content-Type-Options nosniff always;
            add_header X-Frame-Options SAMEORIGIN always;
            add_header X-XSS-Protection "0" always;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; img-src 'self' data:; sandbox" always;
        }

        # 브라우저가 보내는 CSP 위반 보고를 받아 로그(Loki)에 남긴다. 본문은 4KB 로 제한한다.
        # $request_body 는 proxy_pass 를 거칠 때만 기록되므로, 컨테이너 내부 전용 응답 서버(127.0.0.1:8099)로 넘긴다.
        location = /csp-report {
            limit_except POST { deny all; }
            limit_req zone=csp_reports burst=20 nodelay;
            client_max_body_size 4k;
            client_body_buffer_size 4k;
            access_log /dev/stdout csp_report;
            proxy_pass http://127.0.0.1:8099;
        }

        # 관리자 인가 확인 (auth_request 전용 내부 location). Authorization 헤더만 IAM 으로 전달한다.
        location = /_auth_admin {
            internal;
            proxy_pass http://iam_upstream/api/v1/admin/authz;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            # upstream 이름(iam_upstream)의 밑줄이 Host 로 나가면 Tomcat 이 400 으로 거부하므로 원래 Host 를 전달한다.
            proxy_set_header Host $host;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # 2. DORO Central Observability / Loki Log Query API (관리자 전용)
        location /loki/ {
            auth_request /_auth_admin;
            # 조회(GET/HEAD)만 허용. push 등 쓰기는 promtail 이 도커 네트워크로 직접 수행한다.
            limit_except GET HEAD {
                deny all;
            }
            proxy_pass http://loki_upstream/loki/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 3. DORO IAM Auth, Session, Admin, Password, Users APIs
        # 접두사 일치가 비슷한 이름(예: /api/v1/authors)까지 IAM 으로 보내지 않도록 경계(/ 또는 끝)까지 맞춘다.
        location /api/v1/auth/ {
            proxy_pass http://iam_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location ~ ^/api/v1/sessions(/|$) {
            proxy_pass http://iam_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location ~ ^/api/v1/admin/users(/|$) {
            proxy_pass http://iam_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # OAuth 클라이언트 등록/조회/비활성화 관리자 API (IAM). 슬래시까지 포함해 이 경로만 IAM 으로 보낸다.
        # 이 location 이 없으면 /api/v1/ 접두사(블로그 백엔드)로 흘러간다.
        location /api/v1/admin/oauth/ {
            proxy_pass http://iam_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /api/v1/users/me/password {
            proxy_pass http://iam_upstream/api/v1/users/me/password;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 회원탈퇴 요청은 IAM 이 처리한다. 이 location 이 없으면 /api/v1/ 접두사(블로그 백엔드)로 흘러간다.
        location = /api/v1/users/me/deletion {
            proxy_pass http://iam_upstream/api/v1/users/me/deletion;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /api/v1/users/me {
            proxy_pass $users_me_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 4-1. DORO Blog (/blog/): 접두사(/blog)를 떼고 블로그 컨테이너/백엔드로 넘긴다(메뉴·게임·파티 API 와 같은 방식).
        #      웹은 VITE_BASE_PATH=/blog 로 빌드되어 에셋을 /blog/assets/ 로 부르고, 이 location 이 /assets/ 로 바꿔 컨테이너에 전달한다.
        #      보안 헤더/CSP 는 서버 공통 값을 그대로 상속한다(이 location 에는 add_header 를 두지 않는다).
        location = /blog {
            return 302 /blog/;
        }

        location /blog/api/ {
            limit_req zone=blog_writes burst=20 nodelay;
            proxy_pass http://blog_api_upstream/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /blog/ {
            proxy_pass http://blog_web_upstream/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 4. Blog Backend API (/api/v1/posts, /api/v1/users 등)
        location /api/v1/ {
            limit_req zone=blog_writes burst=20 nodelay;
            proxy_pass http://blog_api_upstream/api/v1/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 5. DORO IAM API & OIDC Discovery
        location /iam/ {
            proxy_pass http://iam_upstream/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 5-1. OAuth 동의 화면은 포털 SPA 가 렌더링한다. 정확 일치(=)는 접두사 /oauth2/ 보다 우선하므로
        #      브라우저 흐름 IAM /oauth2/authorize -> 302 /oauth2/consent -> 포털 이 공개 Origin 에서 이어진다.
        location = /oauth2/consent {
            proxy_pass http://portal_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /oauth2/ {
            proxy_pass http://iam_upstream/oauth2/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /.well-known/ {
            proxy_pass http://iam_upstream/.well-known/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 6. Portal Static Icons & Assets
        location = /shield.svg {
            proxy_pass http://portal_upstream/shield.svg;
            proxy_set_header Host $host;
        }

        location /assets/ {
            proxy_pass $assets_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 7. DORO Central Portal Routes (Logs, Login, Signup, Account, Consent)
        location ~ ^/(logs|login|signup|account|portal)(/.*)?$ {
            proxy_pass http://portal_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 도로 파티 (/party/): deploy/gateway-party.conf 에서 옴
        location /party/api/ {
            client_max_body_size 11m;
            proxy_pass http://party_api_upstream/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /party/ {
            proxy_pass http://party_web_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_hide_header Content-Security-Policy;
            add_header X-Content-Type-Options nosniff always;
            add_header X-Frame-Options SAMEORIGIN always;
            add_header X-XSS-Protection "0" always;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Permissions-Policy "camera=(), microphone=(), payment=(), usb=(), geolocation=(self)" always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval' https://dapi.kakao.com https://t1.daumcdn.net https://t1.kakaocdn.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; font-src 'self' data: https://cdn.jsdelivr.net; img-src 'self' data: blob: https:; connect-src 'self' https://dapi.kakao.com https://*.daumcdn.net https://*.kakao.com; worker-src 'self'; manifest-src 'self'; frame-ancestors 'self'; base-uri 'self'; object-src 'none'; form-action 'self'; report-uri /csp-report" always;
        }

        location = /party {
            return 301 /party/;
        }

        # 도로 게임 천국 (/games/): deploy/gateway-games.conf 에서 옴
        location /games/api/ {
            proxy_pass http://games_api_upstream/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /games/ {
            proxy_pass http://games_web_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_hide_header Content-Security-Policy;
            add_header X-Content-Type-Options nosniff always;
            add_header X-Frame-Options SAMEORIGIN always;
            add_header X-XSS-Protection "0" always;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Permissions-Policy "camera=(), microphone=(), payment=(), usb=(), geolocation=()" always;
            add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; font-src 'self' data: https://cdn.jsdelivr.net; img-src 'self' data:; connect-src 'self'; worker-src 'self'; manifest-src 'self'; frame-ancestors 'self'; base-uri 'self'; object-src 'none'; form-action 'self'; report-uri /csp-report" always;
        }

        location = /games {
            return 301 /games/;
        }

        # 8. DORO Menu Frontend (오늘 뭐 먹지? 도로메뉴 서브 서비스)
        location /menu/ {
            proxy_pass http://menu_upstream/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /menu {
            return 301 /menu/;
        }

        # 8-1. DORO Menu Static Assets (/doro/)
        location /doro/ {
            proxy_pass http://menu_upstream/doro/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 9. 메인 주소: Doro 허브(포털 SPA). 블로그는 /blog/ 로 옮겼다.
        location = / {
            proxy_pass http://portal_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 9-1. 루트에 두는 공용 정적 파일. robots.txt 는 크롤러가 루트에서만 읽으므로 포털이 준다(/blog/ 경로의 비공개 영역 Disallow 포함).
        location = /robots.txt {
            proxy_pass http://portal_upstream;
            proxy_set_header Host $host;
        }

        # 9-1b. 허브 PWA 파일(서비스 워커·매니페스트·아이콘): 서비스 워커 범위가 / 여야 해서 루트에 둔다. 블로그 PWA 파일은 /blog/ 아래에 있다.
        location ~ ^/(sw\.js|registerSW\.js|workbox-[A-Za-z0-9_-]+\.js|manifest\.webmanifest|icon-192\.png|icon-512\.png|apple-touch-icon\.png|favicon\.svg|index\.html)$ {
            proxy_pass http://portal_upstream;
            proxy_set_header Host $host;
        }

        # 블로그 컨테이너에 있던 루트 파일(로고, 파비콘): 이미 공유된 글의 og:image 가 이 주소를 가리킨다.
        location ~ ^/(doro-logo\.png|favicon\.png)$ {
            proxy_pass http://blog_web_upstream;
            proxy_set_header Host $host;
        }

        # 9-2. 옛 블로그 주소(/@사용자/글, /tags, /search ...)는 /blog 아래로 보낸다. 블로그가 루트를 차지하던 때의 링크를 살린다.
        #      안정된 것을 확인하고 영구 이동(301)으로 바꿨다. 301 은 브라우저가 기억하므로 되돌려도 이미 방문한 사람은 계속 /blog/ 로 간다.
        location / {
            return 301 /blog$request_uri;
        }
    }
}
